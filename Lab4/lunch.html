<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собрать ланч — БизнесЛанч</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lunch.css">
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <header>
        <h1>Бизнес Ланч</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="lunch.html" id="active">Собрать ланч</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Супы</h2>
            <div class="dishes" id="soup"></div>
        </section>

        <section>
            <h2>Главные блюда</h2>
            <div class="dishes" id="main"></div>
        </section>

        <section>
            <h2>Напитки</h2>
            <div class="dishes" id="drink"></div>
        </section>

    </main>

    <section class="order">
        <h2>Оформить заказ</h2>
        <form action="https://httpbin.org/post" method="POST">

            <div class="order-col">
                <h3>Ваш заказ</h3>
                <div id="order"></div>

                <label for="comment">Комментарий</label>
                <textarea name="comment" id="comment" rows="4"></textarea>
            </div>

            <div class="order-col">
                <h3>Данные клиента</h3>

                <label for="name">Имя</label>
                <input type="text" name="name" id="name" required>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <label for="subscribe">
                    <input type="checkbox" name="subscribe" id="subscribe" checked>
                    Подписаться на рассылку
                </label>

                <label for="phone">Телефон</label>
                <input type="tel" name="phone" id="phone" required>

                <label for="address">Адрес</label>
                <input type="text" name="address" id="address" required>

                <p>Время доставки</p>
                <label for="delivery-now">
                    <input type="radio" name="time" value="now" id="delivery-now" required>
                    Как можно скорее
                </label>
                <label for="delivery-later">
                    <input type="radio" name="time" value="later" id="delivery-later">
                    В указанное время
                </label>

                <label for="time">Укажите время</label>
                <input type="time" name="time-choice" id="time" min="07:00" max="23:00" step="300">

                <button type="reset">Сбросить</button>
                <button type="submit">Отправить</button>
            </div>

        </form>
    </section>

    <footer>
        <p>Контакты компании «БизнесЛанч»</p>
        <p>Телефон: <a href="tel:+74951234567">+7 (495) 123-45-67</a></p>
        <p>Email: <a href="mailto:order@businesslunch.ru">order@businesslunch.ru</a></p>
        <p>г. Москва, ул. Примерная, д. 1</p>
    </footer>

    <script src="dishes.js"></script>
    <script src="render.js"></script>
    <script src="order.js"></script>
</body>
</html>
